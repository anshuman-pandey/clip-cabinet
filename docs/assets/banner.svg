<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-labelledby="title desc"><title id="title">Clip Cabinet — show it once</title><desc id="desc">Local recording. Your file. Your server. Open-source alternative to Loom.</desc><rect width="1280" height="380" rx="24" fill="#173c3f"/><circle cx="1110" cy="185" r="110" fill="#24585b"/><rect x="994" y="115" width="190" height="130" rx="16" fill="none" stroke="#b9d6ce" stroke-width="3"/><path d="M1066 147L1066 213L1120 180Z" fill="#dce9c4"/><circle cx="1170" cy="125" r="12" fill="#e8a69a"/><text x="68" y="80" fill="#b9d6ce" font-family="Arial,sans-serif" font-size="18" letter-spacing="4">CLIP CABINET</text><text x="64" y="167" fill="#faf8ef" font-family="Georgia,serif" font-size="64">Show it once.</text><text x="68" y="220" fill="#faf8ef" font-family="Arial,sans-serif" font-size="25">Keep the file. Share on your terms.</text><text x="68" y="307" fill="#b9d6ce" font-family="Arial,sans-serif" font-size="18">LOCAL RECORDING  /  SELF-HOSTED LINKS  /  MIT LICENSED</text></svg>
