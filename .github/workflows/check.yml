name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest==9.2.0
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: docker build -t clip-cabinet:acceptance .
      - name: Container persistence and browser acceptance
        env:
          CLIP_TEST_BROWSER: '1'
        run: python3 scripts/docker_acceptance.py
